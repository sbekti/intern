version: "2"
overrides:
  go:
    rename:
      na: Nas
sql:
  - engine: postgresql
    schema:
      - db/migrations
    queries:
      - db/queries
    gen:
      go:
        package: db
        out: internal/db
        sql_package: pgx/v5
        emit_db_tags: true
        emit_json_tags: true
        emit_interface: true
        emit_empty_slices: true
        emit_pointers_for_null_types: true
        query_parameter_limit: 0
        json_tags_case_style: snake
