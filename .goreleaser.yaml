version: 2

project_name: internctl

builds:
  - id: internctl
    main: ./cmd/internctl
    binary: internctl
    env:
      - CGO_ENABLED=0
    goos: [darwin, linux, windows]
    goarch: [amd64, arm64]
    ldflags:
      - >-
        -s -w
        -X github.com/sbekti/intern/internal/buildinfo.Version={{ .Version }}
        -X github.com/sbekti/intern/internal/buildinfo.Commit={{ .Commit }}
        -X github.com/sbekti/intern/internal/buildinfo.Date={{ .Date }}
        -X github.com/sbekti/intern/internal/cli/config.DefaultServerURL=https://intern.bekti.com

archives:
  - id: internctl
    ids: [internctl]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    files: [README.md, LICENSE]

checksum:
  name_template: checksums.txt

release:
  draft: false
  prerelease: auto

homebrew_casks:
  - repository:
      owner: sbekti
      name: homebrew-tap
      branch: main
      token: "{{ .Env.HOMEBREW_TAP_GITHUB_TOKEN }}"
    directory: Casks
    binaries: [internctl]
    homepage: https://github.com/sbekti/intern
    description: Command-line client for Intern
    hooks:
      post:
        install: |
          if OS.mac?
            system_command "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "#{staged_path}/internctl"]
          end
