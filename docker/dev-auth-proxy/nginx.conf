events {}

http {
  upstream intern_api {
    server intern-api:8080;
  }

  upstream intern_www {
    server host.docker.internal:3000;
  }

  map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
  }

  server {
    listen 18080;
    server_name _;

    location ^~ /api/v1/ {
      proxy_pass http://intern_api;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-Host $host;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header Connection "";
      proxy_set_header Authorization $http_authorization;
      proxy_set_header Remote-User "alice";
      proxy_set_header Remote-Name "Alice Example";
      proxy_set_header Remote-Email "alice@example.com";
      proxy_set_header Remote-Groups "Users";
      proxy_set_header X-Intern-Forward-Auth "authenticated-ingress";
    }

    location / {
      proxy_pass http://intern_www;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-Host $host;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_set_header Authorization $http_authorization;
      proxy_set_header Remote-User "alice";
      proxy_set_header Remote-Name "Alice Example";
      proxy_set_header Remote-Email "alice@example.com";
      proxy_set_header Remote-Groups "Users";
      proxy_set_header X-Intern-Forward-Auth "authenticated-ingress";
    }
  }

  server {
    listen 18081;
    server_name _;

    location ^~ /api/v1/ {
      proxy_pass http://intern_api;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-Host $host;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header Connection "";
      proxy_set_header Authorization $http_authorization;
      proxy_set_header Remote-User "bob";
      proxy_set_header Remote-Name "Bob Example";
      proxy_set_header Remote-Email "bob@example.com";
      proxy_set_header Remote-Groups "Users,Super-Users";
      proxy_set_header X-Intern-Forward-Auth "authenticated-ingress";
    }

    location / {
      proxy_pass http://intern_www;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-Host $host;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_set_header Authorization $http_authorization;
      proxy_set_header Remote-User "bob";
      proxy_set_header Remote-Name "Bob Example";
      proxy_set_header Remote-Email "bob@example.com";
      proxy_set_header Remote-Groups "Users,Super-Users";
      proxy_set_header X-Intern-Forward-Auth "authenticated-ingress";
    }
  }
}
