events {}

http {
  upstream intern_api {
    server intern-api:8080;
  }

  server {
    listen 18080;
    server_name _;

    location = /auth/device {
      default_type text/plain;
      return 200 "Compose dev proxy placeholder.\nUse the approval endpoint with the displayed user code:\nPOST /api/v1/auth/device_codes/{user_code}/approve\n";
    }

    location / {
      proxy_pass http://intern_api;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header Connection "";
      proxy_set_header Authorization $http_authorization;
      proxy_set_header Remote-User "alice";
      proxy_set_header Remote-Name "Alice Example";
      proxy_set_header Remote-Email "alice@example.com";
      proxy_set_header Remote-Groups "Users";
    }
  }

  server {
    listen 18081;
    server_name _;

    location = /auth/device {
      default_type text/plain;
      return 200 "Compose dev proxy placeholder.\nUse the approval endpoint with the displayed user code:\nPOST /api/v1/auth/device_codes/{user_code}/approve\n";
    }

    location / {
      proxy_pass http://intern_api;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header Connection "";
      proxy_set_header Authorization $http_authorization;
      proxy_set_header Remote-User "bob";
      proxy_set_header Remote-Name "Bob Example";
      proxy_set_header Remote-Email "bob@example.com";
      proxy_set_header Remote-Groups "Users,Super-Users";
    }
  }
}
