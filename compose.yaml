services:
  intern-api:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      INTERN_API_ADDR: ":8080"
      INTERN_API_DATABASE_URL: "${INTERN_API_DATABASE_URL:?set the explicitly configured production database URL}"
      INTERN_API_LOG_LEVEL: "${INTERN_API_LOG_LEVEL:?set the API log level}"
      AUTH_PUBLIC_BASE_URL: "${AUTH_PUBLIC_BASE_URL:?set the public application URL}"
      AUTH_JWT_ISSUER: "${AUTH_JWT_ISSUER:?set the JWT issuer}"
      AUTH_JWT_AUDIENCE: "${AUTH_JWT_AUDIENCE:?set the JWT audience}"
      AUTH_JWT_HMAC_SECRET: "${AUTH_JWT_HMAC_SECRET:?set a strong JWT secret}"
      AUTH_FORWARD_AUTH_MARKER_HEADER: "${INTERN_DEV_IDENTITY_MARKER_HEADER:?set the development identity marker header}"
      AUTH_FORWARD_AUTH_MARKER_VALUE: "${INTERN_DEV_IDENTITY_MARKER:?set the development identity marker value}"
      AUTH_REMOTE_USER_HEADER: "Remote-User"
      AUTH_REMOTE_NAME_HEADER: "Remote-Name"
      AUTH_REMOTE_EMAIL_HEADER: "Remote-Email"
      AUTH_REMOTE_GROUPS_HEADER: "Remote-Groups"
      TRUSTED_PROXY_CIDRS: "${INTERN_TRUSTED_PROXY_CIDRS:?set the private Compose proxy CIDR}"
      AUTH_ADMIN_GROUPS: "${AUTH_ADMIN_GROUPS:?set at least one admin group}"
    expose:
      - "8080"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    develop:
      watch:
        - action: rebuild
          path: .
          ignore:
            - .git/
            - .env
            - .env.*
            - web/
            - node_modules/
            - web/node_modules/
            - web/.next/
            - .next/
            - coverage/
            - dist/
            - tmp/

  intern-web:
    build:
      context: .
      dockerfile: web/Dockerfile
      target: dev
    environment:
      INTERN_API_BASE_URL: "http://intern-api:8080"
      INTERN_PROMETHEUS_BASE_URL: "${INTERN_PROMETHEUS_BASE_URL:?set the Prometheus base URL}"
      INTERN_METRICS_CONFIG_PATH: "/etc/intern/metrics/metrics.yaml"
      AUTH_PUBLIC_BASE_URL: "${AUTH_PUBLIC_BASE_URL:?set the public application URL}"
      INTERN_DEV_IDENTITY_ENABLED: "${INTERN_DEV_IDENTITY_ENABLED:?set development identity mode explicitly}"
      INTERN_DEV_IDENTITY_MARKER_HEADER: "${INTERN_DEV_IDENTITY_MARKER_HEADER:?set the development identity marker header}"
      INTERN_DEV_IDENTITY_MARKER: "${INTERN_DEV_IDENTITY_MARKER:?set the development identity marker value}"
      INTERN_DEV_IDENTITY_USER: "${INTERN_DEV_IDENTITY_USER:?set a development username}"
      INTERN_DEV_IDENTITY_NAME: "${INTERN_DEV_IDENTITY_NAME:?set a development display name}"
      INTERN_DEV_IDENTITY_EMAIL: "${INTERN_DEV_IDENTITY_EMAIL:?set a development email}"
      INTERN_DEV_IDENTITY_GROUPS: "${INTERN_DEV_IDENTITY_GROUPS:?set development groups}"
    depends_on:
      - intern-api
    ports:
      - "${INTERN_WEB_BIND:-0.0.0.0}:${INTERN_WEB_PORT:?set the web port}:3000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ${INTERN_METRICS_CONFIG_SOURCE:-./web/config/metrics.example.yaml}:/etc/intern/metrics/metrics.yaml:ro
    develop:
      watch:
        - action: sync
          path: ./web
          target: /app/web
          ignore:
            - node_modules/
            - .next/
        - action: rebuild
          path: ./package-lock.json
        - action: rebuild
          path: ./web/package.json
