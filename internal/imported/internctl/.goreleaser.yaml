version: 2

project_name: internctl

before:
  hooks:
    - go mod tidy
    - go generate ./internal/api
    - go test ./...

builds:
  - id: internctl
    main: ./cmd/internctl
    binary: internctl
    env:
      - CGO_ENABLED=0
    goos:
      - darwin
      - linux
      - windows
    goarch:
      - amd64
      - arm64
    ldflags:
      - >-
        -s -w
        -X github.com/sbekti/internctl/internal/buildinfo.Version={{ .Version }}
        -X github.com/sbekti/internctl/internal/buildinfo.Commit={{ .Commit }}
        -X github.com/sbekti/internctl/internal/buildinfo.Date={{ .Date }}
        -X github.com/sbekti/internctl/internal/config.DefaultServerURL={{ .Env.DEFAULT_SERVER_URL }}

archives:
  - id: internctl
    ids:
      - internctl
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    formats:
      - tar.gz
    format_overrides:
      - goos: windows
        formats:
          - zip
    files:
      - README.md
      - LICENSE

checksum:
  name_template: "checksums.txt"

release:
  draft: false
  prerelease: auto

brews:
  - repository:
      owner: sbekti
      name: homebrew-tap
      branch: main
      token: "{{ .Env.HOMEBREW_TAP_GITHUB_TOKEN }}"
    directory: Formula
    homepage: "https://github.com/sbekti/internctl"
    description: "Command-line client for the internal management platform"
    license: "MIT"
    commit_author:
      name: "github-actions[bot]"
      email: "41898282+github-actions[bot]@users.noreply.github.com"
    test: |
      system "#{bin}/internctl", "--version"
    install: |
      bin.install "internctl"
    url_template: "https://github.com/sbekti/internctl/releases/download/{{ .Tag }}/{{ .ArtifactName }}"
    commit_msg_template: "Brew formula update for {{ .ProjectName }} {{ .Tag }}"
